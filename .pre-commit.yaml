# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  - repo: local
    hooks:
      - id: bun-audit
        name: Bun Audit
        entry: bun audit --audit-level=high
        language: system
        pass_filenames: false

      - id: biome-lint
        name: Biome Lint
        entry: bun run lint
        language: system
        types: [text]

      - id: bun-build
        name: Bun Build
        entry: bun run build
        language: system
        pass_filenames: false
