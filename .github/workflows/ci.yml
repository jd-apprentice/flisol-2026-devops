name: CI/CD Pipeline

on:
  push:
    branches: [master, develop]
    tags:
      - "v*"
  pull_request:
    branches: [master]

jobs:
  security:
    name: Security
    uses: ./.github/workflows/_security.yml
    secrets: inherit

  quality:
    name: Quality
    uses: ./.github/workflows/_quality.yml
    with:
      bun-version: "1.3.12"
    secrets: inherit

  build:
    name: Build
    needs: [security, quality]
    uses: ./.github/workflows/_build.yml
    with:
      bun-version: "1.3.12"
    secrets: inherit

  release:
    name: Release
    needs: [build]
    permissions:
      contents: write
    # if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/_release.yml
    secrets: inherit

  observability:
    name: Observability
    needs: [build]
    uses: ./.github/workflows/_observability.yml
    with:
      node-version: "24"
    secrets: inherit
