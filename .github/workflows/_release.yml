name: Release Binary

on:
  workflow_call:
    inputs:
      output-name:
        description: Output binary name
        required: false
        default: "flisol"
      release-notes:
        description: Custom release notes path
        required: false
        default: ""

jobs:
  release:
    name: Publish Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: build-artifact
          path: dist/
      - name: Create Release
        uses: softprops/action-gh-release@4dd30955cca228da305ffee6fbc3fc1f95d447c2
        with:
          files: dist/${{ inputs.output-name }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
