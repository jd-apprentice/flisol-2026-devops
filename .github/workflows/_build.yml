name: Build Binary

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_call:
    inputs:
      bun-version:
        type: string
        description: Bun version
        required: false
        default: "1.3.12"
      entrypoint:
        type: string
        description: Entry point file
        required: false
        default: "./src/index.ts"
      output-name:
        type: string
        description: Output binary name
        required: false
        default: "flisol"

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ inputs.bun-version }}
      - name: Install dependencies
        run: bun install
      - name: Build binary
        run: bun build --compile --outfile=dist/${{ inputs.output-name }} ${{ inputs.entrypoint }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: build-artifact
          path: dist/${{ inputs.output-name }}
