name: Quality Code

on:
  workflow_call:
    inputs:
      bun-version:
        description: Bun version
        required: false
        default: "1.3.11"

jobs:
  megalint:
    name: MegaLinter Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ inputs.bun-version }}
      - name: Install MegaLinter
        run: bun add megalinter --dev
      - name: Run MegaLinter
        run: bunx megalinter

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ inputs.bun-version }}
      - name: Install dependencies
        run: bun install
      - name: Run unit tests
        run: bun test
